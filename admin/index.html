<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ToBe · Administración</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-neutral-100 font-sans">
<div id="app"></div>
<script>
/* ═══════════ CONFIG — usa los mismos valores que en tu web ═══════════ */
const SUPABASE_URL = "https://fqjiqrcwvjejmurushsf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxamlxcmN3dmplam11cnVzaHNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0ODI0OTcsImV4cCI6MjA5OTA1ODQ5N30.0_mz2hoeXhklEC2YPQOmckf47a7XDC9NpMs2_-tJJZA";
/* ══════════════════════════════════════════════════════════════════════ */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $app = document.getElementById("app");

let actividades = [], inscripciones = [], espera = [], hayEspera = true;
let tab = "dashboard", busqueda = "", filtroActividad = "todas";

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n || 0).toLocaleString("es-ES", {style:"currency", currency:"EUR"});
/* ⚠️ Ajusta estos dos si tus columnas se llaman distinto en Supabase: */
const precioDe = a => Number(a.precio ?? a.precio_euros ?? a.precio_mes ?? 0);
const plazasDe = a => Number(a.plazas ?? a.plazas_totales ?? 0);

const PALETA = ["bg-rose-500","bg-indigo-500","bg-amber-500","bg-teal-600","bg-teal-500","bg-purple-500"];
const colorDe = idx => PALETA[idx % PALETA.length];
const iconoDe = n => { n=(n||"").toLowerCase();
  if(n.includes("baile")) return "💃"; if(n.includes("ia")) return "🤖";
  if(n.includes("arte")||n.includes("dibujo")) return "🎨";
  if(n.includes("acogida")) return "🏠"; return "⭐"; };
const actividadDe = id => actividades.find(a => String(a.id) === String(id));
const inscritosDe = id => inscripciones.filter(i => String(i.actividad_id) === String(id)).length;
const estadoDe = i => i.estado_pago || "activo";
const mesActual = new Date().toLocaleDateString("es-ES",{month:"long",year:"numeric"});
const edad = f => { if(!f) return null; const n=new Date(f),h=new Date();
  let e=h.getFullYear()-n.getFullYear(); const m=h.getMonth()-n.getMonth();
  if(m<0||(m===0&&h.getDate()<n.getDate())) e--; return e; };

function notificar(msg){
  const d = document.createElement("div");
  d.className = "fixed bottom-4 left-1/2 z-50 -translate-x-1/2 rounded-xl bg-neutral-900 px-5 py-3 text-sm font-medium text-white shadow-lg";
  d.textContent = msg; document.body.appendChild(d);
  setTimeout(() => d.remove(), 3500);
}

/* ---------- datos ---------- */
async function cargarDatos(){
  const [a, i] = await Promise.all([
    sb.from("actividades").select("*").order("id"),
    sb.from("inscripciones").select("*").order("created_at", {ascending:false})
  ]);
  actividades = a.data || []; inscripciones = i.data || [];
  const e = await sb.from("lista_espera").select("*").order("created_at");
  if (e.error) { hayEspera = false; espera = []; } else { hayEspera = true; espera = e.data || []; }
}

function suscribirRealtime(){
  sb.channel("admin-live")
    .on("postgres_changes", {event:"*", schema:"public"}, async () => { await cargarDatos(); renderApp(); })
    .subscribe();
}

/* ---------- LOGIN ---------- */
function renderLogin(msjError){
  $app.innerHTML = `
  <div class="flex min-h-screen items-center justify-center bg-neutral-950 px-4">
    <div class="w-full max-w-sm rounded-2xl bg-white p-8 shadow-xl">
      <div class="text-center">
        <span class="text-3xl font-black italic tracking-tight" style="font-family:'Arial Black',Arial,sans-serif">ToBe</span>
        <div class="text-[9px] font-bold tracking-[0.45em] text-neutral-900">EXPERIENCES</div>
        <div class="mt-4 inline-flex items-center gap-2 rounded-full bg-neutral-100 px-3 py-1 text-xs font-semibold text-neutral-500">🔒 Panel de administración</div>
      </div>
      <input id="email" type="email" placeholder="Email" class="mt-6 w-full rounded-xl border border-neutral-300 px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-neutral-800">
      <input id="pass" type="password" placeholder="Contraseña" class="mt-2 w-full rounded-xl border ${msjError?"border-red-400 bg-red-50":"border-neutral-300"} px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-neutral-800">
      ${msjError ? `<p class="mt-1 text-xs text-red-600">${esc(msjError)}</p>` : ""}
      <button id="btnLogin" class="mt-3 w-full rounded-xl bg-neutral-900 py-3 font-bold text-white hover:bg-neutral-700">Entrar</button>
    </div>
  </div>`;
  const entrar = async () => {
    const {error} = await sb.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("pass").value
    });
    if (error) return renderLogin("Email o contraseña incorrectos");
    await cargarDatos(); renderApp(); suscribirRealtime();
  };
  document.getElementById("btnLogin").onclick = entrar;
  document.getElementById("pass").onkeydown = e => e.key === "Enter" && entrar();
}

/* ---------- COMPONENTES ---------- */
function badgePago(estado){
  const map = {
    activo:   ["bg-green-100 text-green-700","✔ Al corriente"],
    impagado: ["bg-red-100 text-red-700","✖ Impagado"],
    pendiente:["bg-amber-100 text-amber-700","⏳ Pago pendiente"]
  };
  const [cls, txt] = map[estado] || map.activo;
  return `<span class="inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-semibold ${cls}">${txt}</span>`;
}
function kpi(emoji, label, valor, sub, color){
  return `<div class="rounded-2xl border border-neutral-200 bg-white p-4">
    <div class="inline-flex h-9 w-9 items-center justify-center rounded-lg ${color} text-white">${emoji}</div>
    <div class="mt-2 text-2xl font-extrabold text-neutral-900">${valor}</div>
    <div class="text-xs font-medium text-neutral-500">${label}</div>
    ${sub ? `<div class="mt-0.5 text-xs text-neutral-400">${sub}</div>` : ""}
  </div>`;
}

/* ---------- VISTAS ---------- */
function vistaDashboard(){
  const mrr = inscripciones.filter(i => estadoDe(i) === "activo")
    .reduce((s,i) => s + precioDe(actividadDe(i.actividad_id) || {}), 0);
  const totalPlazas = actividades.reduce((s,a) => s + plazasDe(a), 0);
  const impagados = inscripciones.filter(i => estadoDe(i) === "impagado").length;
  const enEspera = espera.filter(e => e.estado === "esperando").length;

  const barras = actividades.map((a, idx) => {
    const oc = inscritosDe(a.id), tot = plazasDe(a);
    const pct = tot ? Math.round(oc/tot*100) : 0;
    return `<div class="flex items-center gap-4 rounded-xl border border-neutral-200 bg-white p-4">
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg ${colorDe(idx)} text-white text-lg">${iconoDe(a.nombre)}</div>
      <div class="min-w-0 flex-1">
        <div class="flex items-baseline justify-between">
          <span class="truncate font-semibold text-neutral-800">${esc(a.nombre)}</span>
          <span class="ml-2 shrink-0 text-sm text-neutral-500">${oc}/${tot}</span>
        </div>
        <div class="mt-1.5 h-2 w-full overflow-hidden rounded-full bg-neutral-100">
          <div class="h-full rounded-full ${pct>=100?"bg-red-500":pct>=70?"bg-orange-400":"bg-green-500"}" style="width:${Math.min(pct,100)}%"></div>
        </div>
      </div>
      <div class="shrink-0 text-right text-sm font-bold text-neutral-700">${fmt(precioDe(a))}<span class="text-xs font-normal text-neutral-400">/mes</span></div>
    </div>`;
  }).join("");

  return `<h1 class="mb-4 text-xl font-extrabold text-neutral-900">Resumen · ${mesActual}</h1>
    <div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
      ${kpi("💶","Ingresos recurrentes / mes",fmt(mrr),"Inscripciones al corriente","bg-green-600")}
      ${kpi("🧒","Niños/as inscritos",inscripciones.length,`de ${totalPlazas} plazas totales`,"bg-indigo-600")}
      ${kpi("📋","En lista de espera",enEspera,hayEspera?"":"Tabla no creada aún","bg-amber-500")}
      ${kpi("⚠️","Recibos impagados",impagados,impagados>0?"Requiere atención":"Todo al día",impagados>0?"bg-red-500":"bg-neutral-400")}
    </div>
    <h2 class="mb-3 mt-8 text-sm font-bold uppercase tracking-wide text-neutral-400">Ocupación por actividad</h2>
    <div class="space-y-3">${barras || '<p class="text-sm text-neutral-400">No hay actividades.</p>'}</div>`;
}

function tarjetaInscripcion(i){
  const a = actividadDe(i.actividad_id) || {nombre:"—"};
  const ed = edad(i.fecha_nacimiento);
  const fecha = i.created_at ? new Date(i.created_at).toLocaleDateString("es-ES") : "";
  const est = estadoDe(i);
  return `<div class="rounded-xl border border-neutral-200 bg-white p-4">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div class="min-w-0">
        <div class="flex flex-wrap items-center gap-2">
          <span class="font-bold text-neutral-900">${esc(i.nombre_nino)}</span>
          ${ed !== null ? `<span class="text-xs text-neutral-400">(${ed} años)</span>` : ""}
          ${i.uso_imagenes
            ? '<span class="inline-flex items-center gap-1 rounded-full bg-blue-100 px-2 py-0.5 text-xs font-semibold text-blue-700">📷 Imágenes ✓</span>'
            : '<span class="inline-flex items-center gap-1 rounded-full bg-neutral-100 px-2 py-0.5 text-xs font-semibold text-neutral-500">📷 Sin autorización</span>'}
          ${badgePago(est)}
        </div>
        <div class="mt-1 text-sm text-neutral-500">${esc(a.nombre)} · Alta: ${fecha}</div>
        <div class="mt-0.5 text-sm text-neutral-500">👤 ${esc(i.nombre_tutor)} · <a class="underline" href="mailto:${esc(i.email)}">${esc(i.email)}</a> · ${esc(i.telefono)}</div>
        ${i.observaciones ? `<div class="mt-2 inline-flex items-center gap-1.5 rounded-lg bg-red-50 px-2.5 py-1 text-xs font-semibold text-red-700">⚠️ ${esc(i.observaciones)}</div>` : ""}
      </div>
      <div class="flex shrink-0 flex-col items-end gap-1.5">
        <button onclick="darDeBaja('${i.id}','${esc(i.nombre_nino)}')" class="rounded-lg border border-red-200 px-3 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-50">🗑 Dar de baja</button>
        ${est === "activo"
          ? `<button onclick="marcarPago('${i.id}','impagado')" class="rounded-lg border border-neutral-300 px-3 py-1.5 text-xs font-semibold text-neutral-600 hover:bg-neutral-50">Marcar impagado</button>`
          : `<button onclick="marcarPago('${i.id}','activo')" class="rounded-lg border border-green-300 px-3 py-1.5 text-xs font-semibold text-green-700 hover:bg-green-50">Marcar al corriente</button>`}
      </div>
    </div>
  </div>`;
}

function inscripcionesFiltradas(){
  return inscripciones.filter(i => {
    const okB = ((i.nombre_nino||"")+(i.nombre_tutor||"")+(i.email||"")).toLowerCase().includes(busqueda.toLowerCase());
    const okA = filtroActividad === "todas" || String(i.actividad_id) === String(filtroActividad);
    return okB && okA;
  });
}

function vistaInscripciones(){
  const lista = inscripcionesFiltradas();
  return `<h1 class="mb-4 text-xl font-extrabold text-neutral-900">Inscripciones (${lista.length})</h1>
    <div class="mb-4 flex flex-col gap-2 sm:flex-row">
      <input id="inpBusca" value="${esc(busqueda)}" placeholder="Buscar por niño/a, tutor o email…"
        class="flex-1 rounded-xl border border-neutral-300 bg-white px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-neutral-800">
      <select id="selFiltro" class="rounded-xl border border-neutral-300 bg-white px-3 py-2 text-sm outline-none">
        <option value="todas">Todas las actividades</option>
        ${actividades.map(a => `<option value="${a.id}" ${String(filtroActividad)===String(a.id)?"selected":""}>${esc(a.nombre)}</option>`).join("")}
      </select>
    </div>
    <div id="listaIns" class="space-y-3">
      ${lista.map(tarjetaInscripcion).join("") || '<div class="rounded-xl border border-dashed border-neutral-300 p-8 text-center text-sm text-neutral-400">No hay inscripciones que coincidan.</div>'}
    </div>`;
}

function vistaActividades(){
  return `<h1 class="mb-4 text-xl font-extrabold text-neutral-900">Gestión de actividades</h1>
    <div class="space-y-3">
    ${actividades.map((a, idx) => `
      <div class="flex flex-wrap items-center gap-4 rounded-xl border border-neutral-200 bg-white p-4">
        <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg ${colorDe(idx)} text-white text-lg">${iconoDe(a.nombre)}</div>
        <div class="min-w-0 flex-1">
          <div class="font-bold text-neutral-900">${esc(a.nombre)}</div>
          <div class="text-sm text-neutral-500">${fmt(precioDe(a))}/mes</div>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-sm text-neutral-500">${inscritosDe(a.id)} inscritos</span>
          <div class="flex items-center gap-1 rounded-lg border border-neutral-200 p-1">
            <button onclick="cambiarPlazas('${a.id}',-1)" class="rounded px-2 py-1 hover:bg-neutral-100" title="Reducir plazas">−</button>
            <span class="w-14 text-center text-sm font-bold text-neutral-800">${plazasDe(a)} pl.</span>
            <button onclick="cambiarPlazas('${a.id}',1)" class="rounded px-2 py-1 hover:bg-neutral-100" title="Ampliar plazas">+</button>
          </div>
        </div>
      </div>`).join("")}
    </div>
    <p class="mt-4 text-xs text-neutral-400">💡 No puedes reducir las plazas por debajo del número de inscritos actuales.</p>`;
}

function vistaEspera(){
  if (!hayEspera) return `<h1 class="mb-4 text-xl font-extrabold text-neutral-900">Lista de espera</h1>
    <div class="rounded-xl border border-dashed border-neutral-300 p-8 text-center text-sm text-neutral-400">La tabla <code>lista_espera</code> no existe aún en Supabase. Ejecuta el SQL de configuración.</div>`;
  const esperando = espera.filter(e => e.estado === "esperando");
  return `<h1 class="mb-4 text-xl font-extrabold text-neutral-900">Lista de espera</h1>
    ${espera.length === 0 ? '<div class="rounded-xl border border-dashed border-neutral-300 p-8 text-center text-sm text-neutral-400">No hay nadie en lista de espera. 🎉</div>' : `
    <div class="space-y-3">
    ${espera.map((e, idx) => {
      const a = actividadDe(e.actividad_id) || {nombre:"—"};
      const fecha = e.created_at ? new Date(e.created_at).toLocaleDateString("es-ES") : "";
      return `<div class="flex flex-wrap items-center gap-4 rounded-xl border border-neutral-200 bg-white p-4">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-amber-100 font-extrabold text-amber-700">#${idx+1}</div>
        <div class="min-w-0 flex-1">
          <div class="font-bold text-neutral-900">${esc(e.nombre_nino)}</div>
          <div class="text-sm text-neutral-500">${esc(a.nombre)} · Solicitud: ${fecha}</div>
          <div class="text-sm text-neutral-500">👤 ${esc(e.nombre_tutor)} · ${esc(e.email)}</div>
        </div>
        ${e.estado === "esperando"
          ? `<button onclick="ofrecerPlaza('${e.id}')" class="rounded-lg bg-neutral-900 px-4 py-2 text-sm font-bold text-white hover:bg-neutral-700">📧 Ofrecer plaza</button>`
          : '<span class="inline-flex items-center gap-1 rounded-full bg-blue-100 px-3 py-1 text-xs font-semibold text-blue-700">✉️ Oferta enviada</span>'}
        <button onclick="quitarDeEspera('${e.id}','${esc(e.nombre_nino)}')" class="rounded-lg border border-red-200 px-3 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-50">🗑</button>
      </div>`;
    }).join("")}
    </div>`}
    <p class="mt-4 text-xs text-neutral-400">Al pulsar "Ofrecer plaza" se abre un email preparado para la familia y se marca como oferta enviada.</p>`;
}

function vistaPagos(){
  const activos = inscripciones.filter(i => estadoDe(i) === "activo");
  const cobrado = activos.reduce((s,i) => s + precioDe(actividadDe(i.actividad_id) || {}), 0);
  return `<h1 class="mb-1 text-xl font-extrabold text-neutral-900">Pagos · ${mesActual}</h1>
    <p class="mb-4 text-sm text-neutral-500">Al corriente este mes: <strong class="text-green-700">${fmt(cobrado)}</strong></p>
    <div class="overflow-hidden rounded-xl border border-neutral-200 bg-white">
    ${inscripciones.map((i, idx) => {
      const a = actividadDe(i.actividad_id) || {nombre:"—"};
      const ok = estadoDe(i) === "activo";
      return `<div class="flex flex-wrap items-center gap-3 p-4 ${idx>0?"border-t border-neutral-100":""}">
        <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full ${ok?"bg-green-100":"bg-red-100"}">${ok?"✔":"✖"}</div>
        <div class="min-w-0 flex-1">
          <div class="text-sm font-semibold text-neutral-800">${esc(i.nombre_nino)}</div>
          <div class="text-xs text-neutral-500">${esc(a.nombre)} · ${mesActual}</div>
        </div>
        <div class="text-sm font-bold text-neutral-800">${fmt(precioDe(a))}</div>
        ${!ok ? `<button onclick="marcarPago('${i.id}','activo')" class="rounded-lg border border-neutral-300 px-3 py-1.5 text-xs font-semibold text-neutral-700 hover:bg-neutral-50">Marcar cobrado</button>` : ""}
      </div>`;
    }).join("") || '<div class="p-8 text-center text-sm text-neutral-400">Aún no hay inscripciones.</div>'}
    </div>
    <p class="mt-4 text-xs text-neutral-400">💡 De momento el estado de pago se gestiona a mano. Cuando conectemos Stripe, los cobros y sus reintentos aparecerán aquí automáticamente.</p>`;
}

/* ---------- APP ---------- */
function renderApp(){
  const impagados = inscripciones.filter(i => estadoDe(i) === "impagado").length;
  const enEspera = espera.filter(e => e.estado === "esperando").length;
  const TABS = [
    {id:"dashboard", label:"Dashboard"},
    {id:"inscripciones", label:"Inscripciones", badge: inscripciones.length},
    {id:"actividades", label:"Actividades"},
    {id:"espera", label:"Lista de espera", badge: enEspera},
    {id:"pagos", label:"Pagos", badge: impagados}
  ];
  const vistas = {dashboard:vistaDashboard, inscripciones:vistaInscripciones, actividades:vistaActividades, espera:vistaEspera, pagos:vistaPagos};

  $app.innerHTML = `
  <header class="border-b border-neutral-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
      <div class="flex items-center gap-3">
        <span class="text-xl font-black italic tracking-tight" style="font-family:'Arial Black',Arial,sans-serif">ToBe</span>
        <span class="rounded-full bg-neutral-900 px-2.5 py-0.5 text-xs font-bold text-white">ADMIN</span>
      </div>
      <button id="btnSalir" class="text-sm text-neutral-500 hover:text-neutral-900">↩ Salir</button>
    </div>
    <div class="mx-auto flex max-w-6xl gap-1 overflow-x-auto px-4">
      ${TABS.map(t => `<button data-tab="${t.id}" class="relative flex shrink-0 items-center gap-1.5 border-b-2 px-3 py-2.5 text-sm font-semibold transition ${tab===t.id?"border-neutral-900 text-neutral-900":"border-transparent text-neutral-400 hover:text-neutral-600"}">
        ${t.label}${t.badge > 0 ? `<span class="ml-0.5 rounded-full bg-red-500 px-1.5 text-xs font-bold text-white">${t.badge}</span>` : ""}
      </button>`).join("")}
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-4 py-6">${vistas[tab]()}</main>`;

  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; renderApp(); });
  document.getElementById("btnSalir").onclick = async () => { await sb.auth.signOut(); renderLogin(); };

  const inp = document.getElementById("inpBusca");
  if (inp) inp.oninput = e => { busqueda = e.target.value;
    document.getElementById("listaIns").innerHTML =
      inscripcionesFiltradas().map(tarjetaInscripcion).join("") ||
      '<div class="rounded-xl border border-dashed border-neutral-300 p-8 text-center text-sm text-neutral-400">No hay inscripciones que coincidan.</div>'; };
  const sel = document.getElementById("selFiltro");
  if (sel) sel.onchange = e => { filtroActividad = e.target.value; renderApp(); };
}

/* ---------- ACCIONES ---------- */
window.darDeBaja = async (id, nombre) => {
  if (!confirm(`¿Dar de baja a ${nombre}? Se eliminará su inscripción.`)) return;
  const {error} = await sb.from("inscripciones").delete().eq("id", id);
  if (error) return notificar("❌ " + error.message);
  await cargarDatos(); renderApp(); notificar(`✅ ${nombre} dado/a de baja.`);
};
window.marcarPago = async (id, estado) => {
  const {error} = await sb.from("inscripciones").update({estado_pago: estado}).eq("id", id);
  if (error) return notificar("❌ " + error.message);
  await cargarDatos(); renderApp(); notificar("✅ Estado de pago actualizado.");
};
window.cambiarPlazas = async (id, delta) => {
  const a = actividadDe(id); if (!a) return;
  const nuevas = plazasDe(a) + delta;
  if (nuevas < inscritosDe(id)) return notificar("⚠️ No puedes bajar de los inscritos actuales.");
  const campo = a.plazas !== undefined ? "plazas" : "plazas_totales";
  const {error} = await sb.from("actividades").update({[campo]: nuevas}).eq("id", id);
  if (error) return notificar("❌ " + error.message);
  await cargarDatos(); renderApp();
};
window.ofrecerPlaza = async (id) => {
  const e = espera.find(x => String(x.id) === String(id)); if (!e) return;
  const a = actividadDe(e.actividad_id) || {nombre:""};
  const {error} = await sb.from("lista_espera").update({estado:"ofrecida"}).eq("id", id);
  if (error) return notificar("❌ " + error.message);
  window.open(`mailto:${e.email}?subject=${encodeURIComponent("¡Plaza disponible en "+a.nombre+"! · ToBe Experiences")}&body=${encodeURIComponent("Hola "+(e.nombre_tutor||"")+",\n\n¡Buenas noticias! Se ha liberado una plaza en "+a.nombre+" para "+(e.nombre_nino||"")+".\n\nPara confirmarla, responde a este email en las próximas 24 horas.\n\nUn saludo,\nToBe Experiences")}`);
  await cargarDatos(); renderApp(); notificar(`📧 Email preparado para ${e.email}.`);
};
window.quitarDeEspera = async (id, nombre) => {
  if (!confirm(`¿Quitar a ${nombre} de la lista de espera?`)) return;
  const {error} = await sb.from("lista_espera").delete().eq("id", id);
  if (error) return notificar("❌ " + error.message);
  await cargarDatos(); renderApp();
};

  const {data:{session}} = await sb.auth.getSession();
  if (session) { await cargarDatos(); renderApp(); suscribirRealtime(); }
  else renderLogin();
})();
